services:
  - type: web
    name: nexo-lab-mensual3
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: OPENBLAS_NUM_THREADS
        value: '1'
      - key: OMP_NUM_THREADS
        value: '1'
